# CHG-209：最小 CI —— 只做一件事：让「绿」可复核。
#
# 为什么必须有：本仓库的门禁 + 348 条测试此前全靠人手跑。「我本地跑过了」
# 既不可复核也不可回溯，而这一轮连续三个 P0（读面 lossless JSON / 成员 agent 缺模型 /
# 冷启动恢复未接线）恰好都是**测试绿着、真实会话坏着**——没有流水线，没人能发现绿的边界。
#
# 为什么跑 `npm run build` 而不是 `--check`：`lib/**` 是构建产物（不入库，但随包分发），
# 先重新生成再比对指纹，才能区分「仓库里的产物是旧的」与「生成器本身坏了」。
#
# ⚠️ 本文件里的每条命令都必须真实存在。2026-11-26 修过三处过期：
#   - `npm run bundle` → 脚本已改名为 `build`（上一轮结构对齐时改的）；
#   - `npm ci` → 仓库没有 package-lock.json，`npm ci` 会直接失败；本包零运行时依赖，
#     测试用的宿主协议包由 `plugin/node_modules` 提供（不入库），CI 里不需要安装；
#   - `test/*.test.js` → 没有 .js 测试，glob 不匹配时 `node --test` 会报错。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 项目用 Node 原生 TS type stripping（engines: >=22.18），不需要编译步骤
          node-version: '22'

      - name: 构建产物（lib/ + 包内 design-v2）
        working-directory: plugin
        # 非 TTY 环境会自动放行「DSH 可能正在运行」确认；显式 --force 让日志里没有歧义
        run: node scripts/build-lib.mjs --force

      - name: 测试套件
        working-directory: plugin
        # spec reporter：失败时直接看到用例名（默认 dot reporter 在多平台首跑时只能看到退出码）。
        run: node --test --test-reporter=spec test/*.test.ts

      # 门禁与本地同一个入口（不在 CI 里另写一套命令，否则两套会漂移）
      - name: 门禁（架构 / 指纹 / 文档 / 客户端 / 死代码 / 项目规则）
        run: node tools/check-all.mjs
