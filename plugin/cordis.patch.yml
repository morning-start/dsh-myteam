# dsh-plugin-myteam bundle patch（ADR-005：preset 组合形态）
#
# Loader 语义（cordis-plugin-loader/lib/index.js Entry._init()）：
# 1. 每个装载行必须带 `name`（插件包说明符）——Entry._init 按 options.name import，
#    缺 name 的行 import 失败被跳过（logger.error）。
# 2. preset 行（@deepseek-ai/dsh-agent-preset）是 EntryGroup：config.plugins 是嵌套
#    子行列表，子行同样按 name 解析、在 preset scope 内激活 → 工具/提示词仅队长会话可见。
# 3. @deepseek-ai/dsh-persona 只能挂在 agent scope（preset 组合内）——顶层全局挂载
#    与 deployment persona 冲突 fail loud（dsh-persona README「No global mount」）。
#
# 三行职责（ADR-003/T0-⑤）：
#   myteam-preset-captain 团队预设（队长会话唯一入口）；
#                         组合内 = myteam-host（服务+Lead 工具）+ myteam-persona-captain（身份）。
#   myteam-host           注册于 preset 组合内 = 服务与工具仅在队长会话 scope 激活（NFR-7.4）。
#                         面板读盘走 workspace 文件（ctx.remote 面板通道 M2 接 gateway 后启用），
#                         不依赖服务可见性。
#
# 成员工具（9 个）不在 preset 层注册——成员由插件经 agents.create 的 setup(agentCtx)
# 在成员作用域内注册（ADR-003），preset 只负责队长。

- insert:
    # 客户端载体行（裸包名，dsh-client-modules 组图约定）：dsh-client-modules/lib/index.js
    # resolveMeta → exactPackageSpecifier（:83-89）只认「不含 / 的裸包名」行——
    # 含子路径的行（如 dsh-plugin-myteam/panel）不进 window.__DSH_BOOT__ 客户端图，
    # 面板/侧栏 UI 整体不可见。preset 内的 myteam-host 行在 PresetTree（root loader
    # 树之外），扫描也看不到。故顶层必须挂一行裸包名；config.carrier=true 让
    # apply 直接返回（宿主职责全部留在 preset 作用域，NFR-7.4；也避免 root 侧
    # 再 provide 'myteam' 与门面造成网关端点歧义）。
    - id: myteam-carrier
      name: 'dsh-plugin-myteam'
      config:
        carrier: true
    # M2 门面行（官方 SessionController 模式，dsh-api-session-controller/lib/index.js:2952）：
    # 根级 typert remote 服务，namespace 仍 'myteam' → 客户端端点 myteam/<method> 不变。
    # 为什么必需：preset 挂载审计要求队长内的 MyTeamRemote isolate（entry-local realm），
    # 而网关 claimsEndpoint/resolveSrcDescriptor 只扫 root 可见服务 → 隔离服务进不了
    # srcClaims，ctx.remote.myteam.* 在 claims 层被拒。门面（root 可见）经官方口子
    # agentPresets.serviceFor(agent,'myteam') 读隔离服务；方法首参 `agent` 命中
    # dsh-agent 的 typert lookup（wire=agentId），网关把客户端传的 sessionId 解析成
    # Agent 实例。inject：门面读 agents（listTeams 会话发现）与 agentPresets（serviceFor）。
    # v2 R4 未完成：面板 RPC 入口（原 `dsh-plugin-myteam/panel`）尚未实现，
    # 该行已从 patch 移除；否则安装时 import 失败会让整条 patch 静默跳过。
    # 恢复条件：panel 适配器落地并重新导出 "./panel"。
    - id: myteam-preset-captain
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: myteam-captain
        name: 团队模式
        description: '团队模式（myteam）：队长会话统一规划名册与任务 DAG、分发成员、裁决 escalate，面板可查看看板与角色。从诞生起只做协调不做领域工作。'
        order: 100
        plugins:
          - id: myteam-host
            name: 'dsh-plugin-myteam'
            # 行级 inject（EntryOptions.inject，loader internal/plugin 钩子并入 fiber.inject）：
            # 等价于插件 apply 函数上的 .inject 属性，双保险且在清单里显式可见。
            inject: ['tools', 'agents']
            # 行级 isolate（EntryOptions.isolate，Dict<true|string>）：把本行提供的服务名
            # 映射到 entry-local realm（LocalRealm，键后缀 '#<entry.id>'）。
            # 必需：preset 挂载审计 mountPreset → leakedServices 检查「preset 子树是否
            # 把服务发布到 root realm」——无 isolate 时 cordis reflect.provide 会写
            # root[isolate][name] = Symbol(name)（cordis lib/index.js L805），MyTeamRemote
            # 的 'myteam' 键就等于 root 键 → 判定泄漏 → 抛
            # `Preset services require isolate realms: myteam`（preset 卡片「加载失败」）。
            # 有 isolate 时实现存于 realm 私有符号，root 键不同 → 不泄漏。
            # 官方对照：dsh-experimental-agent-team 的 TeamService(super(ctx,'agentTeams'))
            # 挂在 profile 顶层行（不在 preset 内）→ 不受 preset 泄漏审计。
            isolate:
              myteam: true
          - id: myteam-persona-captain
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 myteam 团队的队长（Captain）。职责与工具边界（v2）：
                1. 看板与任务：用 myteam_read_board / myteam_read_task / myteam_read_team 了解现状；
                   用 myteam_create_task 建任务（每条至少一条可检验的验收标准），依赖用 dependencies 表达。
                2. 工作流：用 myteam_create_workflow 定义可复用工作流，myteam_start_workflow 实例化运行。
                3. 名册：用 myteam_appoint_member 按角色聘任成员；成员会话由宿主创建，你只决定角色与父子收窄。
                4. 认领与裁决：myteam_claim_task 把任务交给成员；成员提交评审后，你用 myteam_review_task
                   写裁决（pass/fail/blocked，附检查结果与证据），通过后 myteam_complete_task 关闭任务。
                5. 知识：myteam_propose_knowledge 提案（必须带证据），myteam_adopt_knowledge 采纳。
                6. 不做领域工作：写代码、写文档、改数据是成员的事；你不代替成员执行，也不伪造完成。
                7. 你不拥有成员工具（myteam_progress / myteam_evidence / myteam_submit_review），
                   也不拥有人类专属动作（解散团队、发布、接管、cutover）——那些必须由人确认。
                8. 信息不足时先澄清再建任务；同一问题不重复问，用户可随时喊停。
          # CHG-212（可用性实测）：**能力必须挂在根层，不能只挂在 preset 里**。          #
          # 实测结论（真实队长会话 + 真模型成员）：
          #   队长会话 = 根层工具 + preset 追加项 → 有 read/write/edit
          #   成员会话 = **只有根层工具**（`agents.create` 继承的是 root 工具面）
          # 所以 CHG-211 把文件工具只加进 preset，队长能干活、成员一个文件都写不出来，
          # 成员只能 escalate 说「我没有命令执行、没有文件写入」——产品空转。
          #
          # 修法：把文件与命令工具**开在根层**（见文件末尾的根层 patch 段），
          # 队长与成员同时继承；preset 不再重复声明（重复声明 = 两处配置漂移）。
          # 队长「不做领域工作」靠 persona 约束，不靠「不给他工具」——工具面是能力，不是纪律。

    # CHG-212（ADR-010 P3）：**成员 preset**——子代理成员的工具面。
    #
    # 为什么需要它：成员改成 `subagents.startActivation({agentPreset})` 后，宿主的
    # local child `setup` 是管理器私有的（dsh-subagent/manager.ts:826），插件插不进去；
    # 成员工具只能由 preset 装。本行的小插件在成员会话作用域注册 13 个成员工具，
    # 执行时按 `exec.agent → parentSession → agentPresets.serviceFor(captain,'myteam')`
    # 找回**同一个** host 服务（账本单写者不变，见 docs/27 §2.1）。
    #
    # 文件/命令工具不在这里重复声明：已在文件末尾的根层段落里开给「队长与成员共同继承」。
    - id: myteam-preset-member
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: myteam-member
        name: 团队成员
        description: '团队模式成员（子代理）：3 个成员工具（进度/证据/提交评审）+ 根层文件与命令工具；角色与工作纪律由角色定义注入。'
        order: 101
        plugins:
          - id: myteam-member-tools
            name: 'dsh-plugin-myteam/member'
            # 行级 inject 与插件上的 .inject 双保险（同 myteam-host 行的理由）
            inject: ['tools', 'agents', 'agentPresets', 'systemPrompt']

# ── 根层能力（CHG-212）：队长与成员**共同继承** ─────────────────────────────
#
# 为什么放根层：成员由 `agents.create` 继承的是**根 host 工具面**，preset 追加项到不了
# 成员会话（实测：队长有 read/write，成员一个都没有）。根层开这三组，成员才可能产出交付物。
#
# profile 仍可覆盖：`preset-minimal` 的 `read: false` 之类 preset 变体会遮蔽这里的同名工具。
# 本文件不写 `applyPatch: true`：apply_patch 不是成员产出的必需品，edit/write 足够。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  # base/web-app 层把根层 tool-fs 设成了 `disabled: true`：只写 config 不会把它打开，
  # 必须**显式** `disabled: false`（漏了这一行的表现是「配置看起来全对，成员还是没有 read」）。
  disabled: false
  config:
    applyPatch: false
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: false
  # 必填且**无 schema 默认值**：漏了就是 invalid config（CHG-211a 让整个 preset 静默消失的正是这条）
  config:
    sampleOverCapGlobResults: false
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'